name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    name: Unit tests (host Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and dev dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

  docker-build-and-functional-tests:
    name: Build image and run each subcommand against sample data
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run the test suite inside Docker (test stage)
        run: docker build --target test -t toolbox-container:test .

      - name: Build the production runtime image
        run: docker build --target runtime -t toolbox-container:latest .

      - name: Functional test - hash-files
        run: |
          docker run --rm -v "$PWD/sample-data:/data" toolbox-container:latest \
            hash-files /data/csv
          test -f sample-data/csv/checksums.txt
          echo "hash-files produced a manifest"

      - name: Functional test - convert-csv-json
        run: |
          docker run --rm -v "$PWD/sample-data:/data" toolbox-container:latest \
            convert-csv-json /data/csv/sample.csv /data/csv/sample.json
          test -f sample-data/csv/sample.json
          echo "convert-csv-json produced JSON output"

      - name: Functional test - resize-image
        run: |
          docker run --rm -v "$PWD/sample-data:/data" toolbox-container:latest \
            resize-image --in-dir /data/images --out-dir /data/images-out --max-dimension 100
          test -f sample-data/images-out/sample1.png
          test -f sample-data/images-out/sample2.png
          echo "resize-image produced resized output files"

      - name: Functional test - lint-json correctly fails on invalid.json (exit 5)
        run: |
          set +e
          docker run --rm -v "$PWD/sample-data:/data" toolbox-container:latest \
            lint-json /data/json --schema /data/json-schema.json
          code=$?
          set -e
          echo "Exit code was $code"
          if [ "$code" -ne 5 ]; then
            echo "Expected exit code 5 (VALIDATION_FAILED) because sample-data/json/invalid.json is present"
            exit 1
          fi

      - name: Functional test - wait-for returns 0 for a reachable target
        run: |
          docker network create ci-net
          docker run -d --rm --name ci-target --network ci-net python:3.12-slim python -m http.server 9999
          sleep 2
          docker run --rm --network ci-net toolbox-container:latest wait-for ci-target:9999 --timeout 15
          echo "wait-for correctly returned 0 for a reachable target"
          docker rm -f ci-target
          docker network rm ci-net

      - name: Functional test - wait-for returns 1 for an unreachable target
        run: |
          set +e
          docker run --rm toolbox-container:latest wait-for 127.0.0.1:1 --timeout 3 --interval 1
          code=$?
          set -e
          echo "Exit code was $code"
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 (TIMEOUT) for an unreachable target"
            exit 1
          fi

      - name: Build the example-api image (proves toolbox-as-a-base-image works)
        run: docker build -t example-api:latest ./example-api

      - name: Clean up files generated by the functional tests
        if: always()
        run: |
          rm -f sample-data/csv/checksums.txt sample-data/csv/sample.json
          rm -rf sample-data/images-out
